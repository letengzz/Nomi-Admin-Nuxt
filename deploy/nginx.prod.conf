# =============================================================================
# 正式环境：宿主机 Nginx 终止 TLS + certbot 自动签发/续期证书
# =============================================================================
# 配套关系：
#   测试环境 → compose.yaml + deploy/nginx.conf（对外 3000，纯 HTTP）
#   正式环境 → compose.yaml + compose.prod.yaml + 本文件（宿主机 80/443 + HTTPS）
# 正式环境下 app 只绑 127.0.0.1:3000，容器里的 nginx 不启动，TLS 在宿主机这一层终结。
#
# ★ 部署前必做：对本文件做一次全局替换，把示例域名 admin.example.com 换成你的真实域名。
#   配置里涉及 server_name ×2、ssl_certificate ×1、ssl_certificate_key ×1，
#   注释里那处提及也一并替换即可，不影响配置。
#   然后放到 /etc/nginx/conf.d/nomi-admin.conf。完整步骤见《部署指南》3.7 节。
#
# 本配置承接 deploy/nginx.conf 里那三个易踩的坑：
#   ① proxy_buffering off  —— 否则 SSE / 流式渲染失效
#   ② client_max_body_size —— 否则上传报 413 且应用日志无记录
#   ③ X-Forwarded-*        —— 否则来源 IP 全是容器地址，限流与审计失效
# =============================================================================

upstream nomi_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---- 80：只做 ACME 验证 + 全站跳转 HTTPS ------------------------------------
server {
    listen 80;
    server_name admin.example.com;

    # certbot certonly --webroot -w /var/www/certbot 会往这里写验证文件。
    # 部署前先建目录并给 nginx 读权限：
    #   sudo mkdir -p /var/www/certbot && sudo chmod 755 /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：TLS 终结 + 反向代理 -------------------------------------------------
server {
    # nginx ≥ 1.25.1 若提示 listen ... http2 已弃用，把 http2 去掉、另加一行 http2 on;。
    listen 443 ssl http2;
    server_name admin.example.com;

    # certbot 签发的证书默认落在这个路径，域名部分同样要替换。
    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 安全响应头。注意 nginx 的 add_header 继承规则：子 location 里一旦出现任何
    # add_header，server 级的所有 add_header 都会失效 —— 所以 /_nuxt/ 里重复写了一遍。
    # 首次上线若担心 HSTS 锁死，可先把 max-age 调成 300 观察一周再改回一年。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源，长缓存。
    location /_nuxt/ {
        proxy_pass http://nomi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 健康检查不记日志，避免探针把有用日志冲掉。
    location = /api/health {
        proxy_pass http://nomi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        access_log off;
    }

    location / {
        proxy_pass http://nomi_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # 流式渲染 / SSE 的关键一行，默认 on 会缓冲整段响应。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
