name: CI / GitHub Pages

# 完整链路：质量门禁 → nuxt generate 静态化 → 发布到 GitHub Pages。
#
# 发布出去的是**演示站**，不是连数据库的生产站：Pages 上没有 Nitro、没有 MySQL，
# 所以构建时注入 NUXT_PUBLIC_DEMO=1，所有 /api/** 请求在浏览器里由 app/mock
# 从内存应答（数据来自 shared/constants/seed-data.ts，与后端种子同源）。
# 登录页任意账号 + 任意密码都能进，进入后的增删改只在当前页面生效，刷新即复原。
#
# Pages 项目页挂在 /<repo>/ 子路径下，baseURL 不能写死，必须由
# actions/configure-pages 的 base_path 输出决定（它来自 GitHub API，
# 仓库名大小写也以它为准）。缺了这一步，HTML 里的 /_nuxt/ 资源会指向
# 域名根目录，页面打开就是一片空白。
#
# 首次运行前需要在仓库 Settings > Pages > Build and deployment 里把
# Source 设为 "GitHub Actions"（只需点一次，之后 workflow 会自动发布）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 官方建议：部署排队但不取消，避免两次发布互相覆盖。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本不写死：读 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:style

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
      # 不在这里跑 pnpm build：pages job 的 nuxt generate 本身包含完整
      # 生产构建，重复一次只会多花两分钟。

  pages:
    name: Build & deploy to GitHub Pages
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 读取站点真实 base_path / base_url；Pages 未启用时两者可能为空，
      # 下面的步骤会用仓库名兜底。
      - uses: actions/configure-pages@v5
        id: pages

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve site base path
        id: site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          base="${PAGES_BASE_PATH:-/$repo}"
          [[ "$base" == /* ]] || base="/$base"
          [[ "$base" == */ ]] || base="$base/"
          site_url="${PAGES_BASE_URL:-https://${GITHUB_REPOSITORY%%/*}.github.io${base%/}}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=$site_url" >> "$GITHUB_OUTPUT"
          echo "Using baseURL=$base / site.url=$site_url"

      - name: Generate static demo site
        env:
          # 演示模式：不连数据库，所有 /api/** 在浏览器里由 app/mock 从内存应答。
          # 这个开关同时让 nuxt.config.ts 把后台每个页面预渲染成 HTML 壳。
          NUXT_PUBLIC_DEMO: '1'
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
          NUXT_SITE_URL: ${{ steps.site.outputs.url }}
        run: pnpm generate

      - name: Disable Jekyll and ensure SPA fallback
        env:
          # 下面的跳转目标校验要用到它，别只看构建那一步。
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
        run: |
          # Pages 默认用 Jekyll 处理产物，会忽略下划线开头的 _nuxt/ 目录；
          # 没有这个空文件，所有 JS/CSS 都会 404。
          touch .output/public/.nojekyll
          # 深链兜底：预渲染只覆盖了固定路径（nuxt.config.ts 的 DEMO_PRERENDER_ROUTES），
          # /admin/notice/123 这类带参数的路由没有被预生成。Pages 对未知路径返回
          # 404.html，所以把 SPA 壳（200.html）覆盖过去 —— 浏览器拿到壳之后再按
          # 地址栏的真实路径路由，深链才不至于停在 404 页面。
          if [ -f .output/public/200.html ]; then
            cp .output/public/200.html .output/public/404.html
          else
            echo "::warning::没有 200.html，跳过 SPA 兜底（后台深链可能 404）"
          fi
          # 兜底校验：这几份是预渲染的产物，缺了说明 prerender 没生效。
          # index.html 特别重要 —— 少了它，站点根 URL 直接是 Pages 的 404 页。
          test -f .output/public/index.html
          test -f .output/public/admin/index.html
          test -f .output/public/login/index.html
          # 根路径的跳转必须带上仓库子路径，否则会被跳到 <user>.github.io/admin
          # 这个不属于本仓库的地址（Pages 只会回一张 404）。
          grep -q "${NUXT_APP_BASE_URL%/}/admin" .output/public/index.html || {
            echo "::error::.output/public/index.html 的跳转目标缺少 baseURL"; exit 1;
          }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
