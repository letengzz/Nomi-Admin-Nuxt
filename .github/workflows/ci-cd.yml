name: CI / GitHub Pages

# 完整链路：质量门禁 → nuxt generate 静态化 → 发布到 GitHub Pages。
#
# Pages 项目页挂在 /<repo>/ 子路径下，baseURL 不能写死，必须由
# actions/configure-pages 的 base_path 输出决定（它来自 GitHub API，
# 仓库名大小写也以它为准）。缺了这一步，HTML 里的 /_nuxt/ 资源会指向
# 域名根目录，页面打开就是一片空白。
#
# 首次运行前需要在仓库 Settings > Pages > Build and deployment 里把
# Source 设为 "GitHub Actions"（只需点一次，之后 workflow 会自动发布）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 官方建议：部署排队但不取消，避免两次发布互相覆盖。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本不写死：读 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:style

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
      # 不在这里跑 pnpm build：pages job 的 nuxt generate 本身包含完整
      # 生产构建，重复一次只会多花两分钟。

  pages:
    name: Build & deploy to GitHub Pages
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 读取站点真实 base_path / base_url；Pages 未启用时两者可能为空，
      # 下面的步骤会用仓库名兜底。
      - uses: actions/configure-pages@v5
        id: pages

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve site base path
        id: site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          base="${PAGES_BASE_PATH:-/$repo}"
          [[ "$base" == /* ]] || base="/$base"
          [[ "$base" == */ ]] || base="$base/"
          site_url="${PAGES_BASE_URL:-https://${GITHUB_REPOSITORY%%/*}.github.io${base%/}}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=$site_url" >> "$GITHUB_OUTPUT"
          echo "Using baseURL=$base / site.url=$site_url"

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
          NUXT_SITE_URL: ${{ steps.site.outputs.url }}
        run: pnpm generate

      - name: Disable Jekyll and ensure SPA fallback
        run: |
          # Pages 默认用 Jekyll 处理产物，会忽略下划线开头的 _nuxt/ 目录；
          # 没有这个空文件，所有 JS/CSS 都会 404。
          touch .output/public/.nojekyll
          # Nuxt generate 会产出 404.html 供客户端路由回退，兜一层保险。
          test -f .output/public/404.html || cp .output/public/200.html .output/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
